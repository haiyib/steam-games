name: update

permissions:
  contents: write  # allow the workflow to commit CSV changes

on:
  workflow_dispatch:      # manual run button in GitHub UI
  schedule:
    - cron: '0 */2 * * *'   # run every 2 hours

jobs:
  daily:
    runs-on: ubuntu-latest

    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python packages
        run: |
          pip install jupyter nbconvert requests pandas

      - name: Check the notebook is intact
        run: |
          # Catch unresolved merge/stash conflict markers, which have been
          # committed before and make the notebook invalid JSON.
          if grep -nE '^(<<<<<<<|>>>>>>>)' cheapshark-update.ipynb; then
            echo "::error::cheapshark-update.ipynb contains unresolved conflict markers."
            exit 1
          fi
          python - << 'PY'
          import json, sys
          from pathlib import Path
          p = Path("cheapshark-update.ipynb")
          if not p.exists():
              sys.exit("::error::cheapshark-update.ipynb not found")
          try:
              nb = json.loads(p.read_text(encoding="utf-8"))
          except json.JSONDecodeError as e:
              sys.exit(f"::error::notebook is not valid JSON: {e}")
          print(f"OK: {len(nb['cells'])} cells, nbformat {nb['nbformat']}")
          PY

      - name: Run notebook to update CSV
        run: |
          # Write the executed copy outside the repo so the notebook in git is
          # never rewritten by CI. The notebook is source; the CSVs are output.
          # The generous timeout matters: cell 1 makes 30 sequential API calls,
          # and nbconvert's default is only 30s per cell.
          jupyter nbconvert --execute --to notebook cheapshark-update.ipynb \
            --output-dir /tmp --output executed.ipynb \
            --ExecutePreprocessor.timeout=900

      - name: Show top20 CSV preview
        run: |
          echo "Top 20 deals CSV preview:"
          ls -l steam_deals_top20_rangeplot.csv || echo "CSV not found"
          head -n 5 steam_deals_top20_rangeplot.csv || echo "No preview"

      - name: Commit and push any changes
        run: |
          git config user.name "Automated"
          git config user.email "actions@users.noreply.github.com"
          # Only the generated CSVs — never the notebook. Committing the
          # notebook made CI's kernel metadata fight the local kernel's and
          # produced a merge conflict on every pull.
          git add cheapshark_updated.csv steam_deals_top20_rangeplot.csv
          git diff --cached --quiet && echo "No data changes." && exit 0
          timestamp=$(date -u)
          git commit -m "Latest data: ${timestamp}"
          # Rebase in case a human pushed while this run was executing
          git pull --rebase --autostash origin main
          git push
